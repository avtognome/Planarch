[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"
[[redirects]]
  from = "/api/spotify-title"
  to = "/.netlify/functions/spotify-title"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
